# 零食效期管家 · Nginx 反向代理示例
# 1. 把 snack.example.com 替换成你的域名
# 2. 创建 /etc/nginx/.htpasswd：
#    sudo apt install -y apache2-utils
#    sudo htpasswd -c /etc/nginx/.htpasswd snackadmin
# 3. 放到 /etc/nginx/sites-available/snack-expiry 并软链到 sites-enabled
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. sudo certbot --nginx -d snack.example.com

server {
    listen 80;
    listen [::]:80;
    server_name snack.example.com;

    # 手机拍摄原图较大，和 server.py 的 10MB 限制保持余量
    client_max_body_size 15m;

    # 应用本身没有账号体系，公网必须加一层登录保护
    auth_basic "Snack Expiry Manager";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR 首次识别可能需要下载模型 / 推理，超时放宽
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
